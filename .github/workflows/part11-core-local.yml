name: Part 11 core plus local dimensions
on:
  workflow_dispatch:
  push:
    branches: [research/part6-chart-transitions]
    paths:
      - 'research/part11_core_local_test.py'
      - '.github/workflows/part11-core-local.yml'
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy
      - run: python research/part11_core_local_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: part11-core-local
          path: research/data/part11_core_local.json
