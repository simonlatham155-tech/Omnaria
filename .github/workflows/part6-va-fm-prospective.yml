name: Part 6 VA FM prospective
on:
  push:
    branches: [research/part6-chart-transitions]
    paths:
      - 'research/va_fm_reconstructed_renderer.py'
      - 'research/part6_regenerate_va_fm.py'
      - 'research/part6_score_frozen_rule.py'
      - '.github/workflows/part6-va-fm-prospective.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy
      - name: Regenerate VA FM trace
        run: python research/part6_regenerate_va_fm.py --samples 41 --seed 618033 --out-dir research/data/part6
      - name: Detect observed handoff
        run: python research/part6_chart_transition.py research/data/part6/va_fm_forward_PROSPECTIVE.npz --reverse research/data/part6/fm_va_reverse_PROSPECTIVE.npz --out research/data/part6/va_fm_detected.json
      - name: Score frozen rule
        run: python research/part6_score_frozen_rule.py research/data/part6/va_fm_detected.json --out research/data/part6/va_fm_frozen_rule.json
      - uses: actions/upload-artifact@v4
        with:
          name: part6-va-fm-prospective
          path: |
            research/data/part6/va_fm_detected.json
            research/data/part6/va_fm_frozen_rule.json
            research/data/part6/va_fm_forward_PROSPECTIVE.npz
            research/data/part6/fm_va_reverse_PROSPECTIVE.npz
