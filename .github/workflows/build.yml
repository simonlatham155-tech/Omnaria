name: Build OMNARIA

on:
  push:
    branches: [ main, agent/latworld-foundation ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  macos-universal:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build Release
        run: cmake --build build --config Release --target Omnaria_All --parallel 4

      - name: Upload plug-ins
        uses: actions/upload-artifact@v4
        with:
          name: Omnaria-macOS-universal
          path: build/Omnaria_artefacts/Release
          if-no-files-found: error
