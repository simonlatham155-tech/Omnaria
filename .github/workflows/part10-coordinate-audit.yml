name: Part 10 coordinate audit
on:
  workflow_dispatch:
  push:
    branches: [research/part6-chart-transitions]
    paths:
      - 'research/part10_coordinate_audit.py'
      - '.github/workflows/part10-coordinate-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy
      - run: python research/part10_coordinate_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: part10-coordinate-audit
          path: research/data/part10_coordinate_audit.json
