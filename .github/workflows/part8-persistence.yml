name: Part 8 persistence
on:
  push:
    branches: [research/part6-chart-transitions]
    paths:
      - 'research/part8_*'
      - '.github/workflows/part8-persistence.yml'
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy
      - name: Regenerate Part 8 suite
        run: python research/part8_regenerate.py
      - name: Score persistence
        run: |
          set -e
          for f in research/data/part8_persistence/*.npz; do
            key=$(basename "$f" .npz)
            python research/part8_persistence_score.py "$f" --out "research/data/part8_persistence/${key}.json"
          done
      - name: Evaluate preregistered criteria
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('research/data/part8_persistence')
          targets={'sigmoid_waveshape_modal':0.31,'sigmoid_fm_filtered_noise':0.74}
          negatives=['continuous_waveshape','continuous_modal']
          out={'positives':{},'negatives':{},'overall_pass':True}
          for k,t in targets.items():
              r=json.loads((root/f'{k}.json').read_text()); e=abs(r['peak_t']-t); ok=e<=0.05+1e-12
              out['positives'][k]={'ground_truth':t,**r,'abs_error':e,'pass':ok}; out['overall_pass'] &= ok
          for k in negatives:
              r=json.loads((root/f'{k}.json').read_text()); ok=r['peak_ratio']<50
              out['negatives'][k]={**r,'pass':ok}; out['overall_pass'] &= ok
          (root/'part8_result.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: part8-persistence
          path: research/data/part8_persistence/
