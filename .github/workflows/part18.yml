name: Part 18
on:
  push:
    branches: [research/part6-chart-transitions]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - run: python research/part18_local_chart_handoff.py
