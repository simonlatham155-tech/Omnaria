name: Part 6 batch2 prospective
on:
  push:
    branches: [research/part6-chart-transitions]
    paths:
      - 'research/part6_cross_family_renderer.py'
      - 'research/part6_regenerate_batch2.py'
      - 'research/part6_batch2_preregister.json'
      - '.github/workflows/part6-batch2-prospective.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy
      - name: Regenerate preregistered batch
        run: python research/part6_regenerate_batch2.py --samples 41 --seed 618033 --out-dir research/data/part6_batch2
      - name: Detect and score all pairs
        run: |
          set -e
          for pair in additive_modal granular_fm waveterrain_nonlinearchaos; do
            python research/part6_chart_transition.py \
              research/data/part6_batch2/${pair}_forward_PROSPECTIVE.npz \
              --reverse research/data/part6_batch2/${pair}_reverse_PROSPECTIVE.npz \
              --out research/data/part6_batch2/${pair}_detected.json
            python research/part6_score_frozen_rule.py \
              research/data/part6_batch2/${pair}_detected.json \
              --out research/data/part6_batch2/${pair}_frozen_rule.json
          done
      - name: Evaluate preregistered criterion
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('research/data/part6_batch2')
          pairs=['additive_modal','granular_fm','waveterrain_nonlinearchaos']
          out={'tolerance':0.025,'pairs':{},'success_count':0}
          for p in pairs:
              det=json.loads((root/f'{p}_detected.json').read_text())
              pred=json.loads((root/f'{p}_frozen_rule.json').read_text())
              obs=float(det['bidirectional']['forward_transition_midpoint'])
              guess=float(pred['predicted_handoff_midpoint'])
              err=abs(obs-guess)
              success=err <= 0.025 + 1e-12
              out['pairs'][p]={'observed':obs,'predicted':guess,'abs_error':err,'success':success,'bidirectional_reproduction':bool(det['bidirectional']['bidirectional_reproduction']),'sound_ratio_to_median':float(det['forward']['candidate_sound_ratio_to_median']),'rotation_deg':float(det['forward']['candidate_rotation_deg'])}
              out['success_count'] += int(success)
          (root/'batch2_result.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: part6-batch2-prospective
          path: research/data/part6_batch2/
