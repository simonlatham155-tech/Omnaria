name: Part 12 richer dimensionality
on:
  workflow_dispatch:
  push:
    branches: [research/part6-chart-transitions]
    paths:
      - 'research/part12_richer_families.py'
      - 'research/part12_dimensionality.py'
      - '.github/workflows/part12-dimensionality.yml'
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy
      - run: python research/part12_dimensionality.py
      - uses: actions/upload-artifact@v4
        with:
          name: part12-dimensionality
          path: research/data/part12/
